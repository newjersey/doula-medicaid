version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
  rewrites:
    - source: /form/welcome
      target: /index.html
      status: 200
    - source: /form/welcome/
      target: /index.html
      status: 200
