version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
  rewrites:
    - source: /humanservices/dmahs/info/doulahelp/
      target: /humanservices/dmahs/info/doulahelp/index.html
      status: 200
    - source: ^/humanservices/dmahs/info/doulahelp/([^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|eot)$)([^.]+$))
      target: /humanservices/dmahs/info/doulahelp/index.html
      status: 200
