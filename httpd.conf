Listen 8080
ServerName localhost

# In container the app files are copied to the Apache DocumentRoot
DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
	Options Indexes FollowSymLinks
	AllowOverride None
	Require all granted
</Directory>

# Serve the single-page app at the desired URL path
Alias "/humanservices/dmahs/info/doulahelp" "/usr/local/apache2/htdocs/index.html"

<IfModule dir_module>
	DirectoryIndex index.html
</IfModule>

ErrorLog "/tmp/httpd_error.log"
LogLevel warn

