name: prettier

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run prettier
        run: npm run prettier:check
