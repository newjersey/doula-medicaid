name: end-to-end-tests-flags-off

on:
  pull_request:
    branches:
      - "main"
  workflow_call:

jobs:
  end-to-end-tests-flags-off:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Use .env.test-flags-off
        run: mv .env.test-flags-off .env.test
      - name: Build the application
        run: NODE_ENV=test npm run build
      - name: Start the application
        run: NODE_ENV=test npm start & npx wait-on http://localhost:3000
      - name: Run cypress tests
        run: npm run cypress:run:flagsOff
